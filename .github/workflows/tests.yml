name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Biome ${{ matrix.biome }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported, newest without manifests, and the locked version.
        biome: ['2.4.5', '2.5.15', 'locked']
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - run: bun install --frozen-lockfile

      - if: matrix.biome != 'locked'
        run: bun add --dev --no-save @biomejs/biome@${{ matrix.biome }}

      - if: matrix.biome == 'locked'
        run: bun run lint && bun run format

      - run: bun test
