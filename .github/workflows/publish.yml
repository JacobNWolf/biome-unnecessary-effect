name: Stage npm release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up tools
        uses: jdx/mise-action@v5

      - name: Install npm with staged publishing support
        run: npm install --global npm@11.21.1

      - name: Check the release tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Release tag $GITHUB_REF_NAME doesn't match package.json version $version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Stage package on npm
        run: npm stage publish --access public ${{ github.event.release.prerelease && '--tag next' || '' }}
